{% extends 'base.html' %}

{% block title %}Server Error | Personal Finance{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-12 col-md-6">
        <div class="glass-card p-5">
            <div class="display-1 text-danger fw-bold mb-3">500</div>
            <h4 class="fw-bold mb-2">Something Went Wrong</h4>
            <p class="text-muted mb-4">An unexpected server error occurred. Please try again or return to the dashboard.</p>
            <a href="{% url 'dashboard' %}" class="btn btn-primary-lg text-decoration-none d-inline-block w-auto px-4">
                <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
